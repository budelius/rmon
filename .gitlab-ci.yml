# rMon is Windows-only (rmon-core links against native Win32/WMI/NVML APIs
# with no cfg(target_os) gates), so there is no Linux runner to fall back
# to -- and running on Windows is also what lets `cargo test` actually
# execute the real Windows-API-touching tests rather than just compile them.
#
# These jobs run on our own EC2 Windows runner (see infra/), not GitLab's
# SaaS runners, which ran out of free compute minutes. The runner is stopped
# by default and bills by the hour, so bring it up around a push:
#
#   .\scripts\ci-runner.ps1 start
#
# A pipeline queued while it is stopped stays `pending` rather than failing,
# and the runner stops itself once the build tools go quiet.

stages:
  - build
  - package

.windows_rust:
  # Must match the tag on the project runner created for infra/.
  tags:
    - rmon-windows
  # Was 3h on the SaaS runners, where every pipeline recompiled every
  # dependency from scratch. This runner keeps the cargo registry and
  # target/ between jobs, so a warm build is minutes -- but the first
  # pipeline after provisioning is still cold, hence the headroom.
  timeout: 1h
  before_script:
    # Rust, WiX and the MSVC toolchain are baked into the instance by
    # infra/bootstrap.ps1 rather than installed per job. Print the versions
    # so a half-provisioned runner fails here with something readable
    # instead of a confusing "link.exe not found" mid-build.
    - rustc --version
    - cargo --version

build:
  extends: .windows_rust
  stage: build
  script:
    - cargo build --workspace --all-targets
    - cargo test --workspace
    - cargo clippy --workspace --all-targets -- -D warnings
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Builds the release CLI and .msi, then publishes both as job artifacts so
# there are stable "latest" downloads for the default branch:
#   https://gitlab.com/martin-wieser/rmon/-/jobs/artifacts/master/download?job=installer
installer:
  extends: .windows_rust
  stage: package
  script:
    # WiX and cargo-wix are preinstalled on the runner (infra/bootstrap.ps1).
    # Installing them per job was a large slice of this job's old two-hour
    # runtime -- cargo-wix was compiled from source every single time.
    - cargo wix --version
    # cargo-wix builds the GUI package, but the installer also contains the
    # CLI used for snapshot/ports/search/MCP, so build that release binary first.
    - cargo build --release -p rmon-cli
    - cargo wix -p rmon-gui --nocapture
  artifacts:
    name: "rmon-windows-$CI_COMMIT_SHORT_SHA"
    paths:
      - target/release/rmon.exe
      - target/wix/*.msi
    expire_in: never
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
