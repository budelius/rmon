[package]
name = "rmon-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors = ["budelius"]
description = "rMon: a live process CPU/GPU monitor"

[[bin]]
name = "rmon-gui"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
eframe = { version = "0.35.0", features = ["persistence"] }
egui_extras = "0.35.0"
egui_plot = "0.36.0"
rmon-agent = { version = "0.3.0", path = "../rmon-agent" }
rmon-core = { version = "0.3.0", path = "../rmon-core" }
tray-icon = "0.24.1"
winreg = "0.56.0"

[build-dependencies]
chrono = "0.4.45"
winresource = "0.1.31"

[dev-dependencies]
ico = "0.5.0"
