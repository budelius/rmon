[package]
name = "rmon-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
ferrisetw = "1.2.0"
log = "0.4.33"
nvml-wrapper = "0.12.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "=0.32.1", features = ["bundled"] }
sentry = { version = "0.34", features = ["anyhow"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.19"
windows = { version = "0.62.2", features = ["Win32_System_Performance", "Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Memory", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }
winreg = "0.56.0"
wmi = "0.18.4"
