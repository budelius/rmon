[package]
name = "rmon-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rmon"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.4", features = ["derive"] }
csv = "1.4.0"
ctrlc = "3.5.2"
env_logger = "0.11.11"
log = "0.4.33"
rmon-core = { version = "0.1.0", path = "../rmon-core" }
